# Proves the backend can ship as a self-contained tree on the two systems the
# desktop app targets.
#
# It is deliberately not a unit test: it builds the tree an installer ships,
# puts it OUTSIDE the repository, and starts it there with nothing else
# available. No checkout beside it, no Prisma CLI, no `bun install` at run time,
# no pre-existing database. Green here means a machine that has never seen this
# project can run the server.
#
# The tree itself is built by `scripts/package.ts`, not by steps written here:
# the desktop app's release workflow needs the identical tree, and the same
# logic in two repositories' YAML is a promise that they will drift.
#
# Three requests, and each one fails for a different reason:
#   /health      — the process is up at all
#   /api/library — Prisma, the libSQL native driver and the migrations
#   /            — the dashboard build. This one is here because it was missing:
#                  the package had no public/ and answered 404 on the very page
#                  the desktop app's window loads, while the other two passed.
name: Package smoke test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    strategy:
      # One platform failing must not hide the other's result.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # bash everywhere, Windows included (Git Bash ships on the runner), so the
    # steps are written once instead of once per platform.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # The dashboard is a sibling repository and the server serves its build
      # from ./public. Cloned at main: this proves the two fit together, and a
      # release pins the version instead.
      - name: Check out the dashboard
        uses: actions/checkout@v5
        with:
          repository: gastonlarap-a11y/manga-tracker-dashboard
          path: dashboard

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Generated into src/generated (gitignored): it gets bundled in, so the
      # target machine never runs the Prisma CLI.
      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:./build.db"

      - name: Build the dashboard
        working-directory: dashboard
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Assemble the shippable package
        run: |
          set -euo pipefail
          PKG="${RUNNER_TEMP}/package"
          bun run package -- --out "$PKG" --dashboard dashboard/dist
          echo "PKG=$PKG" >> "$GITHUB_ENV"
          echo "package size: $(du -sh "$PKG" | cut -f1)"

      - name: Verify no personal infrastructure leaked into the package
        run: |
          set -euo pipefail
          if grep -rIl "kv-mangatracker\|rg-proyectos-personales" "$PKG" 2>/dev/null; then
            echo "::error::Azure resource names leaked into the package"
            exit 1
          fi
          echo "clean: no personal Azure resource names in the package"

      - name: Start the server from the package
        run: |
          set -euo pipefail
          cd "$PKG"
          # A database that does not exist yet: the server has to create and
          # migrate it on its own, which is the whole point.
          DATABASE_URL="file:${RUNNER_TEMP}/smoke.db" \
          PORT=5199 \
          MIGRATIONS_DIR="$PKG/migrations" \
            bun run index.js > "${RUNNER_TEMP}/server.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/server.pid"

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5199/health > /dev/null 2>&1; then
              echo "healthy after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::server never became healthy"
          cat "${RUNNER_TEMP}/server.log"
          exit 1

      - name: Confirm it migrated the database itself
        run: |
          set -euo pipefail
          grep -q "applied .* migration" "${RUNNER_TEMP}/server.log" || {
            echo "::error::the server did not report applying migrations"
            cat "${RUNNER_TEMP}/server.log"
            exit 1
          }
          cat "${RUNNER_TEMP}/server.log"

      - name: Read and write through Prisma, libSQL and SQLite
        run: |
          set -euo pipefail
          # An empty library is the expected answer on a fresh database; a 500
          # here means the migrations did not run or the native driver is
          # missing from the package.
          body=$(curl -fsS http://127.0.0.1:5199/api/library)
          echo "GET /api/library -> $body"
          test "$body" = "[]"

          curl -fsS -X POST http://127.0.0.1:5199/api/events \
            -H 'content-type: application/json' \
            -d '{"mangaName":"Smoke Test","chapterLabel":"Cap. 1","sourceUrl":"https://example.com/smoke/1"}' \
            > /dev/null
          after=$(curl -fsS http://127.0.0.1:5199/api/library)
          echo "after one reading -> $after"
          case "$after" in
            *"Smoke Test"*) echo "the packaged server reads and writes its database" ;;
            *) echo "::error::the reading was not persisted"; exit 1 ;;
          esac

      - name: Serve the dashboard, which is what the desktop window loads
        run: |
          set -euo pipefail
          # This is the check that was missing. Without public/ in the package
          # the server answers 404 here while /health and /api keep passing,
          # so the app's window would open on an error page.
          root=$(curl -fsS http://127.0.0.1:5199/)
          case "$root" in
            *"<title>Manga Tracker</title>"*) echo "GET / serves the dashboard" ;;
            *) echo "::error::GET / did not return the dashboard"; echo "$root" | head -5; exit 1 ;;
          esac

          # And its assets resolve: an index.html whose scripts 404 is a blank
          # window, which looks exactly like a working one until you use it.
          asset=$(printf '%s' "$root" | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1)
          test -n "$asset"
          curl -fsS -o /dev/null "http://127.0.0.1:5199${asset}"
          echo "asset ${asset} resolves"

      - name: Run the service CLI from the package
        run: |
          set -euo pipefail
          cd "$PKG"
          # It ships beside the server and the desktop app spawns it, so it has
          # to be a working program in the package, not only in the repository.
          status=$(bun run service.js status)
          echo "service.js status -> $status"
          case "$status" in
            *'"ok":true'*) echo "the packaged service CLI answers" ;;
            *) echo "::error::service.js did not answer"; exit 1 ;;
          esac

      - name: Stop the server
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/server.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/server.pid")" 2>/dev/null || true
          fi

      - name: Server log
        if: failure()
        run: cat "${RUNNER_TEMP}/server.log" || true
